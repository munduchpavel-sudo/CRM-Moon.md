services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crmdb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - webnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crmdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/crmdb
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: https://crm.moon-sun.cz/api/calendar/google/callback
    depends_on:
      db:
        condition: service_healthy
    networks:
      - webnet
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  fastapi:
    image: python:3.12-slim
    restart: always
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      uvicorn app:app --host 0.0.0.0 --port 8000"
    environment:
      MODBUS_LIVE_ENABLED: ${MODBUS_LIVE_ENABLED:-true}
      MODBUS_AUTO_POLL_ENABLED: ${MODBUS_AUTO_POLL_ENABLED:-true}
      MODBUS_AUTO_POLL_INTERVAL_SEC: ${MODBUS_AUTO_POLL_INTERVAL_SEC:-60}
      MODBUS_DEFAULT_NETWORK_CIDR: ${MODBUS_DEFAULT_NETWORK_CIDR:-192.168.1.0/24}
      MODBUS_DEFAULT_GATEWAY_IP: ${MODBUS_DEFAULT_GATEWAY_IP:-192.168.1.1}
      MODBUS_DEFAULT_PORT: ${MODBUS_DEFAULT_PORT:-502}
      MODBUS_DEFAULT_UNIT_ID_START: ${MODBUS_DEFAULT_UNIT_ID_START:-1}
      MODBUS_DEFAULT_UNIT_ID_END: ${MODBUS_DEFAULT_UNIT_ID_END:-64}
      MODBUS_DEFAULT_UNIT_ID: ${MODBUS_DEFAULT_UNIT_ID:-1}
      EMS_SQLITE_PATH: /app/data/ems_telemetry.db
      EMS_LOG_LEVEL: ${EMS_LOG_LEVEL:-INFO}
    volumes:
      - ./:/app
      - fastapi_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/system/health', timeout=5); sys.exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      - webnet

  frontend:
    build: ./frontend
    restart: always
    networks:
      - webnet
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:stable-alpine
    restart: always
    volumes:
      - ./infra/nginx/${NGINX_CONF:-default.dev.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      fastapi:
        condition: service_started
    networks:
      - webnet

volumes:
  db_data:
  fastapi_data:

networks:
  webnet:
